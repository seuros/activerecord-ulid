name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: seuros/setup-dictator@master
      - run: dictator lint .

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} @ Rails ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['4.0']
        rails: ['~> 8.1.0', 'edge']
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
